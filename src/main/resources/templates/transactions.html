<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Transactions</title></head>
<body>
<h2>Transaction Search Results</h2>
<table border="1">
    <tr><th>ID</th><th>Description</th><th>Amount</th></tr>
    <tr th:each="t : ${transactions}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.description}"></td>
        <td th:text="${t.amount}"></td>
    </tr>
</table>
</body>
</html>
